<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eggplant Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #game-container {
            position: relative;
            background-color: #2d2d2d;
            border: 4px solid #5a3782;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #a45ee5;
            margin-bottom: 15px;
            font-size: 28px;
        }
        p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #ccc;
            line-height: 1.4;
        }
        button {
            background-color: #a45ee5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:active {
            transform: scale(0.98);
            background-color: #8a3eb5;
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <h1 id="title">Eggplant Snake</h1>
            <p id="instructions">Swipe anywhere on the screen to change directions.<br>Avoid the walls and your own tail!</p>
            <button id="startBtn">Play</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const overlay = document.getElementById("overlay");
        const startBtn = document.getElementById("startBtn");
        const titleElement = document.getElementById("title");
        const instructionsElement = document.getElementById("instructions");

        // Game dimensions adjusted to fit nicely on iPhone screens
        const minScreenDim = Math.min(window.innerWidth - 30, window.innerHeight - 120, 400);
        const gridSize = 20; 
        canvas.width = Math.floor(minScreenDim / gridSize) * gridSize;
        canvas.height = canvas.width; // Keep it square

        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 130; // Milliseconds per frame
        let isGameRunning = false;
        let directionChangedInFrame = false;

        // --- Game Setup ---
        function resetGame() {
            snake = [
                { x: gridSize * 3, y: gridSize * 5 },
                { x: gridSize * 2, y: gridSize * 5 },
                { x: gridSize * 1, y: gridSize * 5 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            directionChangedInFrame = false;
            generateFood();
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;
            
            // Prevent food from spawning inside the snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        function startGame() {
            resetGame();
            overlay.style.display = "none";
            isGameRunning = true;
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameOver() {
            clearInterval(gameInterval);
            isGameRunning = false;
            titleElement.innerText = "Game Over!";
            instructionsElement.innerHTML = `You scored <strong>${score}</strong> points.<br>Swipe or tap button to try again.`;
            startBtn.innerText = "Replay";
            overlay.style.display = "flex";
        }

        // --- Core Loop ---
        function gameLoop() {
            updateSnake();
            if (checkCollision()) {
                gameOver();
                return;
            }
            draw();
            directionChangedInFrame = false;
        }

        function updateSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];
            // Wall collisions
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }
            // Self collisions
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // --- Drawing Graphics ---
        function draw() {
            // Background grid pattern
            for (let r = 0; r < tileCount; r++) {
                for (let c = 0; c < tileCount; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#2d2d2d" : "#252525";
                    ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                }
            }

            // Draw Eggplant
            ctx.font = `${gridSize - 2}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🍆", food.x + gridSize / 2, food.y + gridSize / 2);

            // Draw Snake
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? "#a45ee5" : "#7b3fa3";
                
                // Rounded blocks for body snake
                ctx.beginPath();
                ctx.arc(part.x + gridSize/2, part.y + gridSize/2, (gridSize/2) - 1, 0, 2 * Math.PI);
                ctx.fill();

                // Add small eyes to the head
                if (isHead) {
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(part.x + 6, part.y + 6, 2, 0, 2 * Math.PI);
                    ctx.arc(part.x + 14, part.y + 6, 2, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }

        // --- Input Handling (Swiping & Keys) ---
        function changeDirection(newDx, newDy) {
            if (directionChangedInFrame) return;
            
            // Prevent snake from reversing into itself
            if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;

            dx = newDx;
            dy = newDy;
            directionChangedInFrame = true;
        }

        // Keyboard support (for testing on desktop browsers)
        window.addEventListener("keydown", (e) => {
            if (!isGameRunning) return;
            if (e.key === "ArrowUp") changeDirection(0, -gridSize);
            if (e.key === "ArrowDown") changeDirection(0, gridSize);
            if (e.key === "ArrowLeft") changeDirection(-gridSize, 0);
            if (e.key === "ArrowRight") changeDirection(gridSize, 0);
        });

        // Swipe Tracking for iPhone Touchscreens
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener("touchstart", (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
            if (!isGameRunning) return;
            
            let touchEndX = e.touches[0].clientX;
            let touchEndY = e.touches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            
            // Ignore tiny accidental micro-swipes
            if (Math.max(Math.abs(diffX), Math.abs(diffY)) < 30) return;

            // Determine if swipe was mostly horizontal or vertical
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) changeDirection(gridSize, 0);  // Right
                else changeDirection(-gridSize, 0);         // Left
            } else {
                if (diffY > 0) changeDirection(0, gridSize);  // Down
                else changeDirection(0, -gridSize);         // Up
